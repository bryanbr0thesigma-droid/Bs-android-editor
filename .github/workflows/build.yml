name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Core library tests (host, no NDK required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-tests -- -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build-qmod:
    name: Build .qmod (Quest, arm64-v8a)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      # This job cross-compiles the real native mod and packages a real
      # .qmod using your qpm.json/mod.template.json. It's expected to need
      # iteration: bs-cordl must be pinned (in qpm.json) to a version that
      # matches the Beat Saber build you're targeting, or dependency
      # resolution here will fail or pull mismatched headers. See README.md.
      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install QPM CLI
        # Asset name confirmed from QuestPackageManager/QPM.CLI's own
        # release workflow (.github/workflows/cargo-build.yml +
        # cargo-release.yml as of their v1.5.11 tag): each build matrix
        # entry uploads an artifact named `qpm-<suffix>`, and the release
        # job zips each into `<artifact-name>.zip`, so the Linux x64 binary
        # ships as `qpm-linux-x64.zip` containing a single `qpm` file.
        run: |
          curl -L "https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip" -o qpm.zip
          unzip -o qpm.zip -d qpm-bin
          chmod +x qpm-bin/qpm
          sudo mv qpm-bin/qpm /usr/local/bin/qpm
          qpm --version

      - name: Restore dependencies
        run: qpm restore

      - name: Debug - inspect restored dependency layout
        run: |
          echo "=== extern/includes listing (types/symlinks visible) ==="
          ls -la extern/includes/
          echo "=== per-dependency stat + listing ==="
          for d in beatsaber-hook custom-types bsml scotland2 paper2_scotland2 bs-cordl; do
            echo "--- $d ---"
            stat "extern/includes/$d" || true
            ls -la "extern/includes/$d" || true
          done
          echo "=== any symlinks anywhere under extern? ==="
          find extern -type l -exec ls -la {} \; || true
          echo "=== total file count under extern ==="
          find extern -type f | wc -l
          echo "=== disk usage of extern ==="
          du -sh extern 2>/dev/null || true
          echo "=== does the QPM cache itself have real headers for beatsaber-hook 8.2.1? ==="
          find "$HOME/.local/share/QPM-RS/cache/beatsaber-hook/8.2.1" -maxdepth 3 2>/dev/null | sort || true
          find "$HOME/.local/share/QPM-RS/cache/beatsaber-hook/8.2.1" -iname "logging.hpp" 2>/dev/null || true
          echo "=== any generated qpm/cmake integration files? ==="
          find . -maxdepth 2 -iname "*.cmake" -not -path "./build/*" || true
          find extern -maxdepth 2 -iname "*.cmake" || true
          echo "=== qpm version in use ==="
          qpm --version

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./build.sh

      - name: Package .qmod
        run: |
          # NOTE: qpm-rust's qmod-packaging subcommand has been renamed
          # before; if this fails with "unrecognized subcommand", run
          # `qpm --help` in the log and adjust (see README.md).
          qpm qmod build

      - name: Upload .qmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: bs-android-editor-qmod
          path: "*.qmod"
          if-no-files-found: error
