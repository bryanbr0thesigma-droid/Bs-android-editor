name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Core library tests (host, no NDK required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-tests -- -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build-qmod:
    name: Build .qmod (Quest, arm64-v8a)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      # beatsaber-hook 8.2.1 needs NDK ^29.0.14206865 (its own qpm.json;
      # <android/log_macros.h>, which its headers use, doesn't exist in
      # older NDKs). nttld/setup-ndk@v1 doesn't have that exact build in
      # its download manifest (404), and beatsaber-hook's own default CI
      # path doesn't pin an NDK via any action either — it just uses
      # whatever ubuntu-latest ships with, which GitHub keeps reasonably
      # current. Do the same, and fail loudly with the actual version if
      # it turns out to be too old rather than guess a download URL.
      - name: Locate Android NDK
        id: setup-ndk
        run: |
          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [[ -z "${NDK_PATH}" || ! -d "${NDK_PATH}" ]]; then
            echo "::error::No Android NDK found on this runner (checked ANDROID_NDK_HOME, ANDROID_NDK_LATEST_HOME)" >&2
            exit 1
          fi
          echo "Using NDK at ${NDK_PATH}:"
          cat "${NDK_PATH}/source.properties" || true
          echo "ndk-path=${NDK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Install QPM CLI
        # Asset name confirmed from QuestPackageManager/QPM.CLI's own
        # release workflow (.github/workflows/cargo-build.yml +
        # cargo-release.yml as of their v1.5.11 tag): each build matrix
        # entry uploads an artifact named `qpm-<suffix>`, and the release
        # job zips each into `<artifact-name>.zip`, so the Linux x64 binary
        # ships as `qpm-linux-x64.zip` containing a single `qpm` file.
        run: |
          curl -L "https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip" -o qpm.zip
          unzip -o qpm.zip -d qpm-bin
          chmod +x qpm-bin/qpm
          sudo mv qpm-bin/qpm /usr/local/bin/qpm
          qpm --version

      - name: Restore dependencies
        run: qpm restore

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./build.sh

      - name: Package .qmod
        # Confirmed from QuestPackageManager/qpm.cli's own source
        # (src/commands/qmod/mod.rs): `qpm qmod build` is a deprecated
        # alias for `qpm qmod manifest`, which only regenerates mod.json —
        # it does NOT produce a .qmod file. `qpm qmod zip` is the actual
        # packaging command (it regenerates the manifest internally too).
        run: qpm qmod zip

      - name: Upload .qmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: bs-android-editor-qmod
          path: "*.qmod"
          if-no-files-found: error
